; ESP32-S3 firmware for the solar charger: Envoy reader and OCPP 1.6J server for the wallbox.
; Board: ESP32-S3-DevKit N16R8 (16 MB flash, 8 MB octal PSRAM).
;
;   pio run -e esp32s3 -t upload      build and flash (cable in the UART/COM port)
;   pio device monitor -e esp32s3     watch the log and type console commands
;   pio test -e native                run the unit tests on this computer (no board needed)

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 has OCTAL PSRAM. If the board turns out to have no PSRAM or quad PSRAM,
; see "Troubleshooting" in README.md and change these two lines.
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Ilib/solar_core/src
    -DBOARD_HAS_PSRAM

lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.6.1

; The dashboard page is the Java app's dashboard.html, copied in before each build and embedded in the firmware.
extra_scripts = pre:scripts/copy_dashboard.py
board_build.embed_txtfiles =
    src/web/dashboard.html
    src/web/setup.html
board_build.embed_files = src/web/favicon.png

; Serial output goes through the UART port (the one with the USB-to-serial chip).
monitor_speed = 115200
monitor_filters = time
monitor_echo = yes   ; show what you type when entering console commands
upload_speed = 460800

; Only for when the Mac is plugged into the board's native "USB" port (the one WITHOUT the serial chip).
; Serial output then goes over that cable. On the board tested here the UART/COM port also shows up as
; /dev/cu.usbmodem..., so the port name alone does not tell you which one you are on: use the default build
; (esp32s3) with the UART/COM port.
[env:esp32s3-usb]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Update over Wi-Fi instead of USB: the board must be running firmware that already has OTA (flash it once by cable).
; The password comes from OTA_PASSWORD in src/secrets.h (scripts/ota_auth.py passes it to the uploader).
;   pio run -e esp32s3-ota -t upload
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = brimwatt.local
extra_scripts =
    pre:scripts/copy_dashboard.py
    post:scripts/ota_auth.py

; Unit tests for the portable core (lib/solar_core) on the development machine.
[env:native]
platform = native
test_framework = unity
; The second line asks scripts/native_openssl.py where OpenSSL is (only the Tesla tests use it).
build_flags =
    -std=gnu++17
    -Ilib/solar_core/src
    !python3 scripts/native_openssl.py
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
