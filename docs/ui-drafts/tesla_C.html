<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>
        :root { --bg: #f4f6f9; --card: #fff; --ink: #1f2937; --muted: #64748b; --line: #e2e8f0; --blue: #2563eb;

               font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-text-size-adjust: 100%; }

        .ft b { display: block; font-size: 1.25rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
        .ft small { display: block; font-size: 0.72rem; color: var(--muted); min-height: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ft.solar { --c: var(--solar); grid-column: 1; grid-row: 1; }

        #flowsvg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        .flow.stale .ft b { color: #94a3b8; }

        /* today's numbers */
        .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
        .stat { background: var(--card); border-radius: 14px; padding: 9px 10px; box-shadow: 0 0 0 1px var(--line); min-width: 0; }
        .stat .fl { font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
        .stat b { display: block; font-size: 1.2rem; line-height: 1.3; font-variant-numeric: tabular-nums; }
        .stat small { display: block; font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat.save b { color: var(--green); }
        @media (max-width: 360px) { .stat b { font-size: 1.05rem; white-space: nowrap; } .stat .fl { font-size: 0.62rem; letter-spacing: 0; } .stat small { white-space: normal; line-height: 1.2; } .stat:has(> .info) small { padding-right: 24px; } }

        /* controls */
        .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

        .info { min-height: 0; width: 24px; height: 24px; padding: 0; margin-left: 6px; border-radius: 50%; position: relative; vertical-align: middle;
                background: #e0e7ff; color: #3730a3; font-size: 0.72rem; font-weight: 700; font-style: italic; font-family: Georgia, serif; line-height: 24px; text-transform: none; letter-spacing: 0; }
        .info::before { content: ""; position: absolute; inset: -12px; }   /* a finger-sized tap area around the small circle */
        .info:hover:not(:disabled) { background: #c7d2fe; }
        .hub .info { margin-left: 8px; pointer-events: auto; }
        .stat { position: relative; } .stat:has(> .info) small { padding-right: 20px; }
        .stat > .info { position: absolute; right: 6px; bottom: 7px; margin: 0; }
        #tipbox, #settingsbox { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background: rgba(15, 23, 42, 0.4); overflow-y: auto; overscroll-behavior: contain; }
        #tipbox[hidden], #settingsbox[hidden] { display: none; }

        .setting output { font-size: 1.05rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
        input[type=range] { width: 100%; height: 34px; margin: 2px 0 0; accent-color: var(--blue); cursor: pointer; touch-action: pan-y; }

        /* chart */
        .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
        .tabs button { min-height: 44px; font-size: 0.8rem; padding: 0 4px; border-radius: 9px; }

        .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
        #chart { width: 100%; touch-action: pan-y; }

        /* the settings sheet */

        .smallbtn { min-height: 40px; padding: 0 14px; background: var(--blue, #2a78d6); color: #fff; font-weight: 600; }

        details.more { margin-top: 8px; }

        /* pull to refresh: the WattSync logo slides down and grows as you pull while its sync arrows turn; the bolt pops when you can let go;

        #ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 6px); z-index: 30; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%;
               background: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18), 0 0 0 1px var(--line); pointer-events: none;
               display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(-80px); --p: 0; }
        #ptr svg { width: 46px; height: 46px; display: block; transform: scale(calc(0.6 + 0.4 * var(--p))); }
        #ptr .arrows { transform-origin: 32px 32px; transform: rotate(calc(var(--p) * 150deg)); }

        }
        #toasts { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 10; }
        .toast { padding: 10px 14px; border-radius: 10px; background: #1e293b; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.2); font-size: 0.9rem; opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; }
        .toast.show { opacity: 1; transform: none; } .toast.err { background: #b91c1c; }
        .toast b { display: block; font-weight: 600; } .toast span { display: block; font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
        @media (prefers-reduced-motion: reduce) { .toast, button { transition: none; } }

        /* on a phone the two stacks dissolve into one list, in this order */
        .stack { display: contents; }
        #hero { order: 1; } #flow { order: 2; } #stats { order: 3; } #modes { order: 4; } #chartcard { order: 5; }
        #feedcard { order: 6; } #sessions { order: 7; }

        /* wider screens: two stacks on top and the graph beside the sessions below, so both sides end on the same line */
        @media (min-width: 900px) {
