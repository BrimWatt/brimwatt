<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1060" width="1060" height="1060" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Start-up flow of the ESP32 and when the setup network opens</title><desc id="d">The board loads its settings, opens the setup network when no Wi-Fi is set, tries to join, keeps a new network only if it works, and otherwise puts the old one back and opens the setup network.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs>
<rect width="1060" height="1060" fill="#f8fafc"/>
<rect x="160" y="20" width="260" height="44" rx="22.0" fill="#e0efff" stroke="#0070f3" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="600" fill="#111827"><tspan x="290.0" y="46.9">Power on or restart</tspan></text>
<polyline points="290,64 290,96" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="100" y="96" width="380" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="400" fill="#111827"><tspan x="290.0" y="123.8">Load the settings: what was saved from</tspan><tspan x="290.0" y="142.0">the setup page, otherwise secrets.h</tspan></text>
<polyline points="290,160 290,196" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<polygon points="290,196.0 440.0,246 290,296.0 140.0,246" fill="#fff7e0" stroke="#e5c365" stroke-width="1.5"/>
<text text-anchor="middle" font-size="13" font-weight="600" fill="#111827"><tspan x="290" y="250.6">Is a Wi-Fi network set?</tspan></text>
<polyline points="440,246 640,246" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569"><tspan x="520" y="236.4">No</tspan></text>
<rect x="640" y="206" width="300" height="80" rx="10" fill="#fff7e0" stroke="#e5c365" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="400" fill="#111827"><tspan x="790.0" y="241.8">Open the setup network and</tspan><tspan x="790.0" y="260.0">keep it open (nothing else to do)</tspan></text>
<polyline points="790,286 790,330" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="640" y="330" width="300" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="400" fill="#111827"><tspan x="790.0" y="353.8">Wait until a phone saves</tspan><tspan x="790.0" y="372.0">a network on the setup page</tspan></text>
<polyline points="790,386 790,424" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="640" y="424" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="400" fill="#111827"><tspan x="790.0" y="450.9">Restart the board</tspan></text>
<polyline points="940,446 1030,446 1030,128 480,128" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="end" font-size="12.5" font-weight="600" fill="#475569"><tspan x="1022" y="304.4">start over</tspan></text>
<polyline points="290,296 290,346" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="314" y="326.4">Yes</tspan></text>
<rect x="120" y="346" width="340" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="400" fill="#111827"><tspan x="290.0" y="373.8">Try to join the network</tspan><tspan x="290.0" y="392.0">(up to 30 seconds per try)</tspan></text>
<polyline points="290,410 290,456" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<polygon points="290,456.0 410.0,506 290,556.0 170.0,506" fill="#fff7e0" stroke="#e5c365" stroke-width="1.5"/>
<text text-anchor="middle" font-size="13" font-weight="600" fill="#111827"><tspan x="290" y="510.6">Joined?</tspan></text>
<polyline points="290,556 290,620" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="314" y="594.4">Yes</tspan></text>
<rect x="100" y="620" width="380" height="78" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="400" fill="#111827"><tspan x="290.0" y="645.7">If it was a trial of a new network, keep it.</tspan><tspan x="290.0" y="663.9">Carry on starting: clock, dashboard,</tspan><tspan x="290.0" y="682.1">OCPP server, meter polling</tspan></text>
<polyline points="290,698 290,730" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="160" y="730" width="260" height="44" rx="22.0" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="600" fill="#111827"><tspan x="290.0" y="756.9">Running normally</tspan></text>
<polyline points="410,506 790,506 790,545" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569"><tspan x="485" y="496.4">No</tspan></text>
<polygon points="790,545.0 960.0,600 790,655.0 620.0,600" fill="#fff7e0" stroke="#e5c365" stroke-width="1.5"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827"><tspan x="790" y="596.2">Was this a trial of a network</tspan><tspan x="790" y="612.5">just chosen on the setup page?</tspan></text>
<polyline points="790,655 790,690" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="812" y="680.4">Yes</tspan></text>
<rect x="610" y="690" width="360" height="100" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text text-anchor="middle" font-size="13" font-weight="400" fill="#111827"><tspan x="790.0" y="719.2">Put the previous network back,</tspan><tspan x="790.0" y="736.1">remember why it failed and open the</tspan><tspan x="790.0" y="753.0">setup network for 15 minutes.</tspan><tspan x="790.0" y="769.9">Then try the old network again.</tspan></text>
<polyline points="610,740 560,740" fill="none" stroke="#475569" stroke-width="1.8"/>
<polyline points="960,600 1010,600 1010,890 960,890" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="1022" y="764.4">No</tspan></text>
<polygon points="790,835.0 960.0,890 790,945.0 620.0,890" fill="#fff7e0" stroke="#e5c365" stroke-width="1.5"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#111827"><tspan x="790" y="886.2">Failing for 3 minutes</tspan><tspan x="790" y="902.5">since start-up?</tspan></text>
<polyline points="620,890 560,890" fill="none" stroke="#475569" stroke-width="1.8"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="568" y="858.2">No: wait 5 s,</tspan><tspan x="568" y="874.5">then try again</tspan></text>
<polyline points="790,945 790,975" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="812" y="966.4">Yes</tspan></text>
<rect x="590" y="975" width="400" height="62" rx="10" fill="#fff7e0" stroke="#e5c365" stroke-width="1.5"/>
<text text-anchor="middle" font-size="13" font-weight="400" fill="#111827"><tspan x="790.0" y="1002.1">Open the setup network once, for 15 minutes.</tspan><tspan x="790.0" y="1019.0">Keep retrying every minute while nobody is on it.</tspan></text>
<polyline points="590,1006 560,1006" fill="none" stroke="#475569" stroke-width="1.8"/>
<polyline points="560,1006 560,378 460,378" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="start" font-size="12.5" font-weight="600" fill="#475569"><tspan x="568" y="444.4">try again</tspan></text>
<text text-anchor="start" font-size="12.5" font-weight="400" fill="#475569"><tspan x="100" y="856.2">The setup network also opens by hand:</tspan><tspan x="100" y="872.5">hold BOOT for 5 seconds, or type “setup”.</tspan></text>
</svg>
