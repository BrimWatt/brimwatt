<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">WattSync system overview</title><desc id="d">The Envoy gateway is read every 60 seconds by the controller (a Raspberry Pi or an ESP32-S3, one at a time), which controls the wallbox over OCPP and serves a dashboard to a phone or computer.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="head-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#475569"/></marker></defs>
<rect width="1020" height="470" fill="#f8fafc"/>
<rect x="16" y="16" width="988" height="438" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 4"/>
<text text-anchor="start" font-size="13" font-weight="600" fill="#475569"><tspan x="32" y="42.5">Home network (router and Wi-Fi)</tspan></text>
<rect x="40" y="100" width="220" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="15" font-weight="600" fill="#111827"><tspan x="150.0" y="145.5">Enphase Envoy</tspan><tspan x="150.0" y="165.0">solar and grid meters</tspan></text>
<rect x="780" y="100" width="200" height="100" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="15" font-weight="600" fill="#111827"><tspan x="880.0" y="135.8">Wallbox</tspan><tspan x="880.0" y="155.2">OCPP 1.6J charger</tspan><tspan x="880.0" y="174.8">plugged into the car</tspan></text>
<rect x="400" y="62" width="240" height="268" rx="12" fill="#eef5ff" stroke="#0070f3" stroke-width="1.5"/>
<text text-anchor="middle" font-size="15" font-weight="700" fill="#0b3d91"><tspan x="520" y="89.2">WattSync controller</tspan></text>
<text text-anchor="middle" font-size="12" font-weight="400" fill="#475569"><tspan x="520" y="106.2">only one is connected to the wallbox</tspan></text>
<rect x="420" y="120" width="200" height="86" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="13" font-weight="600" fill="#111827"><tspan x="520.0" y="150.7">Raspberry Pi</tspan><tspan x="520.0" y="167.6">Java app</tspan><tspan x="520.0" y="184.5">dashboard and OCPP on :8080</tspan></text>
<rect x="420" y="220" width="200" height="94" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text text-anchor="middle" font-size="13" font-weight="600" fill="#111827"><tspan x="520.0" y="246.2">ESP32-S3</tspan><tspan x="520.0" y="263.1">C++ firmware</tspan><tspan x="520.0" y="280.0">dashboard :80, OCPP :8080</tspan><tspan x="520.0" y="296.9">setup network</tspan></text>
<polyline points="400,150 260,150" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569"><tspan x="330" y="116.2">HTTPS read</tspan><tspan x="330" y="132.5">every 60 s (token)</tspan></text>
<polyline points="640,150 780,150" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#head)" marker-start="url(#head-start)"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569"><tspan x="710" y="118.2">OCPP over</tspan><tspan x="710" y="134.5">WebSocket</tspan></text>
<text text-anchor="middle" font-size="12" font-weight="400" fill="#475569"><tspan x="710" y="176.4">start, limit, stop</tspan><tspan x="710" y="192.0">status, meter values</tspan></text>
<rect x="400" y="370" width="240" height="64" rx="10" fill="#e0efff" stroke="#0070f3" stroke-width="1.5"/>
<text text-anchor="middle" font-size="14" font-weight="600" fill="#111827"><tspan x="520.0" y="397.8">Phone or computer</tspan><tspan x="520.0" y="416.0">dashboard in a browser</tspan></text>
<polyline points="520,370 520,330" fill="none" stroke="#0070f3" stroke-width="1.8" marker-end="url(#head)"/>
<text text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569"><tspan x="548" y="356.4">HTTP</tspan></text>
<rect x="40" y="330" width="300" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
<text text-anchor="middle" font-size="13" font-weight="400" fill="#111827"><tspan x="190.0" y="361.2">Setup page (ESP32 only)</tspan><tspan x="190.0" y="378.1">join the Wi-Fi “WattSync-Setup”,</tspan><tspan x="190.0" y="395.0">open 192.168.4.1/setup</tspan><tspan x="190.0" y="411.9">to change Wi-Fi and Enphase details</tspan></text>
<polyline points="340,382 400,382" fill="none" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#head)"/>
<text text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569"><tspan x="880" y="238.1">Pi and ESP32 both</tspan><tspan x="880" y="254.4">do the same job; the</tspan><tspan x="880" y="270.6">dashboard page is shared</tspan></text>
</svg>
